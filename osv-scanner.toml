#
# OSV-Scanner policy for the Ycash fork of librustzcash (SECURITY-CI.md). Every entry: the advisory,
# the path that pulls the package in, why it does not reach the six crates ycashd 6.20.0 takes from
# this repository (zcash_protocol, zcash_primitives, zcash_transparent, zcash_address,
# zcash_encoding, f4jumble), and an ignoreUntil at most 90 days out, after which the scan fails
# again and the entry is re-checked. Patch-level fixes are taken in Cargo.lock instead. The Rust
# entries mirror deny.toml [advisories] (which lists only the non-dev ones: exclude-dev = true).


name: GitHub Actions Security Analysis with zizmor 🌈

on:
  push:
    branches: ["main", "upgrade/vault"]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    name: Run zizmor 🌈
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Required for upload-sarif (used by zizmor-action) to upload SARIF files.
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Ycash (2026-10-23): an exact zizmor release rather than the action's default `latest`,
          # the same version across the Yellowback repos (SECURITY-CI.md). Action v0.6.4 is the
          # release whose digest table has 1.30.1.
          version: 1.30.1

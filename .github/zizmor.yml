#
# zizmor configuration for the Ycash fork. ycash-fork.yml (the fork's CI) is zizmor-clean with
# no entry here. The entries are upstream librustzcash's own workflows, kept as upstream wrote
# them except for the scoping in each file's "Ycash (2026-10-06)" note: their tag-pinned
# toolchain/mdbook actions (`dtolnay/rust-toolchain@stable` and the like) are upstream's choice.
rules:
  unpinned-uses:
    ignore: [ci.yml, audits.yml, book.yml, mutants.yml]
  dependabot-cooldown:
    ignore: [dependabot.yml]
